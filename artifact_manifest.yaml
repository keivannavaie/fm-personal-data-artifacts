      - "assurance_case/privacy_assurance_case_skeleton.yaml"
  - id: "telemetry_schema"
    description: "Schema for PD-relevant telemetry and monitoring events"
    related_sections: ["Section 7.10.6–7.10.8", "Tables 20, 29"]
    paths:
      - "telemetry_schema/telemetry_schema.json"
  - id: "unlearning_tests"
    description: "Unlearning/editing test-suite specification"
    related_sections: ["Section 6.4", "Section 8.10"]
    paths:
      - "unlearning_tests/unlearning_test_spec.json"
  - id: "quick_start"
    description: "Practitioner Quick Start one-pager"
    related_sections: ["Appendix A (Practitioner Quick Start)", "Table 28"]
    paths:
      - "quick_start/practitioner_quick_start_1pager.md"
